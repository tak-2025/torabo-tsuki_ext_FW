# Live key/layer feed over a BLE NOTIFY GATT service (e1f4af00) for the
# Torabo-Float desktop overlay. Apply to the CENTRAL: only it knows the layer
# state and the global key position.
#
# The push only fires while a client has subscribed the CCC, so this costs
# nothing on a build no one connects a float to. The caps descriptor advertises
# it as LiveFeed=8 so the app can detect support.
CONFIG_ZMK_LIVE_FEED=y
