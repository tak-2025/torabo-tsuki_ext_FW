# Boot-log capture helper — use together with zmk-usb-logging.
#
# Early driver init (e.g. iqs7211e at POST_KERNEL, ~0.5-1.5s) logs BEFORE the
# USB CDC host attaches, and ZMK's debug spam evicts those messages from the
# default 1KB deferred-log buffer ("--- N messages dropped ---"). Hold ALL boot
# messages in a big buffer and delay the log-processing thread so nothing is
# flushed (or dropped) until the host has had a chance to open the port.
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
