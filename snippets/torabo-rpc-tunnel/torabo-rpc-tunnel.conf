# Carry the torabo settings over the Studio RPC transport as well as the custom
# BLE GATT services — which is what makes every tab work over USB. Apply to the
# CENTRAL: RPC only exists there (ZMK_STUDIO selects ZMK_STUDIO_RPC on the
# central half only), exactly like the GATT services.
#
# This one switch is all a build needs. Each feature module's own bridge
# (CONFIG_ZMK_*_CONFIG_TUNNEL / CONFIG_TORABO_CAPS_TUNNEL /
# CONFIG_ZMK_LIVE_FEED_TUNNEL) is `default y, depends on` this symbol, so a
# feature that is compiled in gets its tunnel window automatically and one that
# is not stays absent. Listing them here instead would mean assigning to symbols
# whose dependencies are unmet on smaller builds, which only earns Kconfig
# warnings.
#
# Nothing is taken away: the GATT services keep working untouched, so BLE clients
# and the existing Torabo-Float are unaffected. The caps descriptor gains an
# RpcTunnel entry (feature id 9) so the app can detect the route.
#
# Costs, measured on the trackball central: ~1 KB flash, ~6 KB RAM (a 2 KB read
# staging buffer plus a larger RPC thread stack, since the request blob is now
# decoded in place there).
CONFIG_ZMK_STUDIO_TORABO_TUNNEL=y

# The RPC receive buffer defaults to 30 bytes, which is fine for stock Studio:
# every request it sends is tiny (a keymap binding is a handful of bytes) and the
# big payloads all travel device -> host. The tunnel is the first thing to send a
# LARGE request — a settings blob of hundreds to thousands of bytes — and 30 bytes
# cannot hold one. That is why READ worked on every tab while WRITE failed on
# every tab: the read REQUEST is ~10 bytes, the write request is not.
#
# Neither transport survived the overflow. Over USB the ISR logs and discards the
# excess, so the decoder waits forever for the rest of a frame that will never
# arrive: no response, then a client-side timeout. Over BLE it was worse — the
# GATT write callback spun waiting for room without ever waking the consumer, so
# the BT RX thread livelocked and the keyboard stopped responding altogether.
#
# 4096 covers the largest request in practice with room to spare (the trackpad
# wire, ~1.5 KB here, plus framing escapes) and the macros write is far smaller at
# one slot per message. Costs ~4 KB of RAM on the central.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=4096

# The blob budget covers every wire in use today (macros READ is the largest at
# 1624 B). A trackpad build with 4 devices and 20 layers encodes 3054 B and would
# need this raised — the READ is refused rather than truncated if it is too small.
# CONFIG_ZMK_STUDIO_TORABO_TUNNEL_BLOB_MAX_SIZE=3072
