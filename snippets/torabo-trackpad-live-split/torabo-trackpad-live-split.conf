# Trackpad live config for the OTHER-SIDE pad arriving over split (device 0).
# Enables the store + its BLE GATT window (default y) and the larger ATT MTU. The
# v2 wire (gestures + per-swipe bindings) can exceed one MTU, so also enable ATT
# prepared writes so the GATT window can reassemble a Write Long. Self-sufficient.
CONFIG_ZMK_TRACKPAD_CONFIG=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=6
