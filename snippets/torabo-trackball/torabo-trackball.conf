# Enable the trackball-config feature (per-layer move/scroll + auto mouse layer)
# and its BLE settings window. Larger ATT MTU so the trackball config value
# (8 + 12*layers bytes; ~128B at 10 layers) fits in a SINGLE GATT write (the
# characteristic rejects offset!=0, i.e. no long-write).
CONFIG_ZMK_TRACKBALL_CONFIG=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
