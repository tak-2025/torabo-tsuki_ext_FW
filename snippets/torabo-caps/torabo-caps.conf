# Let the firmware describe itself to Torabo-Studio (GATT e1f4a000): version,
# which feature modules are compiled in, their wire versions, capability bits.
# The app uses this to show only the tabs this keyboard actually has, instead of
# offering features the firmware cannot do.
#
# Apply to the CENTRAL — it is the half the app talks to. Costs a few hundred
# bytes; there is no reason not to include it.
CONFIG_TORABO_CAPS=y
