# Let the firmware describe itself to Torabo-Studio (GATT e1f4a000): version,
# which feature modules are compiled in, their wire versions, capability bits.
# The app uses this to show only the tabs this keyboard actually has, instead of
# offering features the firmware cannot do.
#
# Apply to the CENTRAL — it is the half the app talks to. Costs a few hundred
# bytes; there is no reason not to include it.
CONFIG_TORABO_CAPS=y

# ---------------------------------------------------------------------------
# BLE resource sizing for "Studio session + split link at the same time"
# (workaround, 2026-09-05)
#
# SYMPTOM: connect the desktop Studio app over BLE while the split link to the
# left half is up, and the right (central) half freezes hard -- key scanning
# stops, both links stall, only a reset recovers it. Studio over USB, or over
# BLE with the left half switched off, is fine.
#
# MECHANISM (working theory): CONFIG_BT_L2CAP_TX_BUF_COUNT is ONE global pool
# shared by every connection, and ZMK pins it to 5 on a central
# (zmk app/src/split/bluetooth/Kconfig, "default 5 if ZMK_SPLIT_ROLE_CENTRAL",
# sized for concurrent GATT discovery -- not for a second talkative link). The
# split link and the Studio link then compete for those 5 buffers. The Studio
# RPC reply path indicates from the system workqueue and waits K_FOREVER for a
# buffer; the split link's own work items run on that same workqueue, so once
# the pool drains there is nothing left to free a buffer. That is a deadlock,
# not a slow patch -- hence "freeze" rather than "lag".
#
# AMPLIFIER: ZMK sizes each RPC indication from the negotiated link-layer PDU
# (gatt_rpc_transport.c get_notify_size_for_conn() returns
# conn_info.le.data_len->tx_max_len). Left at Zephyr's 27-byte default that
# makes every indication 27 bytes, and an ATT indication is acknowledged, so a
# ~1.6 KB getKeymap reply becomes ~60 indicate/confirm round trips, each holding
# a buffer from the shared pool for a whole connection interval.
#
# THE THREE KNOBS ARE ONE MECHANISM, read them together:
#   ZMK_STUDIO_RPC_TX_BUF_SIZE  = how much the RPC layer hands to L2CAP at once
#   BT_L2CAP_TX_BUF_COUNT       = how many of those may be in flight, ALL LINKS
#   BT_CTLR_DATA_LENGTH_MAX     = how much of one goes out per radio event, and
#                                 (because ZMK reuses it, see below) how big one
#                                 ATT indication is allowed to be
# Widening only one of them just moves the queue; the point is to drain a reply
# in few enough radio events that the split link never finds the pool empty.
#
# WHY THIS FILE: the numbers have to land on the RIGHT (central) build every
# time. tako-custom/config/ is builder-generated and must not be hand-edited,
# and a Zephyr-module Kconfig cannot win here: ZMK's app/Kconfig rsources
# src/split/Kconfig (line 248) and Kconfig.defaults (line 715) BEFORE it sources
# Kconfig.zephyr (line 717), and module Kconfigs are pulled in from inside
# Kconfig.zephyr -- the first matching "default" in parse order wins, so ZMK's
# always beats a module's. Zephyr 3.5 has no "configdefault" either. A .conf
# assignment does win, and torabo-caps is the one snippet the firmware-builder
# pushes onto the central unconditionally ("always" at index.html:388), so this
# is the only place that is guaranteed to be there. A user .conf can still
# override any of it.
#
# CAVEAT: DATA_LENGTH_MAX only raises what THIS controller will agree to; the
# peer still has to start the DLE procedure. The PC does; the left half's PDU
# size is governed by the left build's own config, which this file does not
# touch, so the split link keeps its previous behaviour either way.

# 5 -> 16. The actual fix: enough L2CAP TX buffers that a Studio reply cannot
# starve the split link. ~11 x (BT_L2CAP_TX_MTU 247 + headers) of extra RAM.
CONFIG_BT_L2CAP_TX_BUF_COUNT=16

# 27 -> 244. NOT 251, and the 7-byte gap is the whole point.
#
# ZMK feeds tx_max_len straight into bt_gatt_indicate() as the ATT VALUE
# length, but tx_max_len is a LINK-LAYER PDU payload: it also has to carry the
# 4-byte L2CAP header and the 3-byte ATT indication header (opcode + handle).
# So an LL PDU of 251 corresponds to an ATT value of only 251 - 4 - 3 = 244.
#
# Overshoot is a hard failure, not a slow path. Zephyr's bt_att_create_pdu()
# (subsys/bluetooth/host/att.c:3006-3016) skips every channel where
# "len + sizeof(op) > bt_att_mtu(chan)" and returns NULL, so gatt_indicate()
# returns -ENOMEM. ZMK's notif_rpc_tx_cb() then retries 5 times with
# k_sleep(K_MSEC(200)) -- from the system workqueue, so it jams that workqueue
# for ~1 s -- and, because the bytes were already consumed from the TX ring with
# ring_buf_get_finish(), it DROPS the chunk and moves on. Deterministic for
# every chunk of every reply: a wedged workqueue plus a truncated RPC stream.
#
# The ceiling: ATT MTU here is BT_LOCAL_ATT_MTU_UATT = MIN(BT_L2CAP_RX_MTU,
# BT_L2CAP_TX_MTU) = MIN(BT_BUF_ACL_RX_SIZE - 4, 247) = MIN(247, 247) = 247,
# hence 247 - 3 = 244. That is a local ceiling: peers asking for more (Android
# requests 517, Windows 517) still land on 247 by the ATT rule "minimum of the
# two Rx MTUs", so 244 is exact for them, not merely safe.
#
# Caveat for a peer that negotiates a SMALLER ATT MTU (some Apple hosts settle
# at 185) while still doing DLE: the requirement is
# BT_CTLR_DATA_LENGTH_MAX <= ATT_MTU - 3, so such a link needs 182 here. ZMK
# does not clamp notify_size to the MTU, so it cannot adapt on its own.
#
# Upstream ZMK sets no BT_CTLR_DATA_LENGTH_MAX default at all and never calls
# bt_conn_le_data_len_update() (it only "select BT_USER_DATA_LEN_UPDATE" in
# app/src/studio/Kconfig:70, which actually turns the automatic host-side
# request OFF). Stock ZMK therefore always runs at 27, which is why this
# mismatch has never bitten upstream. DLE stays peer-initiated here too; this
# symbol only raises what our controller is willing to agree to.
#
# Requires BT_CTLR_DATA_LENGTH=y, which the software link layer sets by default.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=244

# 2048 -> 3072. The system workqueue now carries GATT indication work for two
# links plus the split work items, and notif_rpc_tx_cb() puts the staging
# buffer on that stack as a VLA ("uint8_t notify_bytes[notify_size]"), which
# grows from 27 to 244 bytes the moment DLE is raised. The stock ZMK depth has
# no margin for either.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# 64 -> 1024. A 64-byte hand-off turns one RPC reply into dozens of L2CAP
# round trips through the shared pool. One buffer per reply chunk instead.
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=1024

# 3 -> 6. The HCI-level ACL TX buffers sit under the L2CAP pool; leaving them
# at 3 would re-create the same bottleneck one layer down.
CONFIG_BT_BUF_ACL_TX_COUNT=6

# 512 -> 1024. The central's split-run thread calls into GATT write paths that
# are deeper now that the pool can block; 512 is uncomfortably tight.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024

# 2200 -> 3072. Longer PDUs (see DATA_LENGTH_MAX) mean deeper RX processing.
CONFIG_BT_RX_STACK_SIZE=3072
