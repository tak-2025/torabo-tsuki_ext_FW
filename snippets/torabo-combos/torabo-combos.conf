# Enable the dynamic-combo feature (live BLE edit, NVS-backed) and its BLE
# settings window. Larger ATT MTU so the combo READ wire (4 + 16*26 = 420 B) and
# the single-shot WRITE (28 B) are comfortable. These MTU lines are shared with
# the torabo-trackball snippet; setting them in both is harmless (same values).
CONFIG_ZMK_DYNAMIC_COMBOS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
