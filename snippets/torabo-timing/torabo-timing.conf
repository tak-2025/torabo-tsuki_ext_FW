# Make the hold-tap timing of &mt / &lt and the matrix kscan debounce windows
# adjustable at runtime (GATT e1f4b000 + tunnel feature 0x10). See
# docs/DESIGN-timing.md.
#
# Apply to the CENTRAL: this is the half the app talks to, and hold-taps are
# decided there. Pair it with torabo-timing-split on the peripheral so the
# debounce windows reach that half's key scanning as well — each half scans its
# own matrix, so without that snippet the peripheral keeps its devicetree
# debounce.
#
# Needs a zmk fork carrying <zmk/torabo_timing.h> (tak-2025/zmk dev). Those hooks
# are __weak, so a fork without this snippet behaves exactly as before.
CONFIG_ZMK_TIMING_CONFIG=y

# The sending end of the split propagation: adds the writer that pushes the two
# debounce bytes to every connected peripheral, on write and again on connect.
# Harmless without a matching peripheral — it simply finds no characteristic to
# write to. This is also what the caps descriptor reports as TIMING bit 0, so the
# app knows whether to promise the user both halves.
CONFIG_ZMK_SPLIT_BLE_DEBOUNCE_SYNC=y

# The wire is 96 B — one ATT write once the MTU is negotiated up. These lines are
# shared with the torabo-combos / torabo-trackball snippets; setting them in more
# than one is harmless (same values).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# What the shield's kscan node actually declares, so a READ can report the true
# default before anything has been written. Keep in sync with the kscan node
# (zmk's zmk,kscan-gpio-matrix binding defaults both to 5).
CONFIG_ZMK_TIMING_CONFIG_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_TIMING_CONFIG_DEBOUNCE_RELEASE_MS=5
