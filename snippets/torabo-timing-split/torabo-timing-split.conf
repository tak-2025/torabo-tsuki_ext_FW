# Let the debounce windows the app writes reach THIS half's key scanning too.
# See docs/DESIGN-timing.md.
#
# Apply to the PERIPHERAL, opposite the central's torabo-timing snippet. Each
# half scans its own matrix, so without this the peripheral keeps the debounce
# baked into its devicetree no matter what the app is told.
#
# This is only the receiving end: the two bytes arrive over the split link and go
# straight to the kscan. There is no store, no NVS, and no settings window here —
# the central owns all of that and re-sends on every connect, so the halves cannot
# drift apart. For the second or two before the link is up, this half scans on its
# devicetree values.
#
# Needs a zmk fork carrying <zmk/torabo_timing.h> and the split debounce
# characteristic. Both seams are __weak / opt-in, so a fork without this snippet
# behaves exactly as before.
CONFIG_ZMK_SPLIT_BLE_DEBOUNCE_SYNC=y
CONFIG_ZMK_TIMING_SPLIT_PERIPHERAL=y
