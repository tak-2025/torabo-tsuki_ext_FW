# Enable the trackpad-config feature (per-layer/per-device role store) and its
# BLE settings window (GATT e1f4ac00). Larger ATT MTU so the trackpad config
# value (6 + device_count*(2 + layers*6) bytes) fits in a SINGLE GATT write (the
# characteristic rejects offset!=0, i.e. no long-write). These MTU values match
# torabo-trackball/torabo-combos, so enabling several together is consistent.
CONFIG_ZMK_TRACKPAD_CONFIG=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
