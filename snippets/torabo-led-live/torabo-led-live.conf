# Runtime-configurable extender LED (rule table + GATT e1f4ae00). Apply to the
# CENTRAL: it holds the whole table, decides what BOTH LEDs show, drives its own
# and pushes the peripheral's over the split.
#
# Do NOT combine with torabo-status-led-ext — they would fight over the same GPIOs.
#
# The builder also emits CONFIG_ZMK_LED_CONFIG_{LEFT,RIGHT}_PRESENT and
# _CENTRAL_IS_LEFT, which the app reads back as capabilities so it renders only
# the sides this keyboard actually has.
CONFIG_ZMK_LED_CONFIG=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Caps Lock as a use case needs ZMK's HID indicator plumbing (default n).
CONFIG_ZMK_HID_INDICATORS=y
