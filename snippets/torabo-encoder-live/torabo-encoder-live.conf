# Runtime-configurable encoder (store + GATT e1f4ad00). Apply to the CENTRAL:
# the store, the rotation behavior and the button processor all live on the half
# that talks to the host and to the app.
#
# MTU values match torabo-trackpad-config/torabo-trackball, so enabling several
# together stays consistent. The encoder wire is ~124 B, so a single write fits.
CONFIG_ZMK_ENCODER_CONFIG=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
